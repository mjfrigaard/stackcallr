url: https://mjfrigaard.github.io/stackcallr/

navbar:
  bg: primary       # paint the bar with $primary (rocket orange)
  type: dark        # light text for contrast on the dark bar

template:
  bootstrap: 5
  theme: arrow-dark
  bslib:
    bg: "#011627"           # Atomic Age dark navy, page background
    fg: "#cbcbcb"           # Atomic Age brushed aluminum, page text
    primary:   "#ff6f3c"   # Atomic Age rocket orange, links, buttons, navbar
    secondary: "#cbcbcb"   # Atomic Age brushed aluminum, neutral text emphasis
    success:   "#2ec4b6"   # Atomic Age teal
    info:      "#cbcbcb"   # Atomic Age brushed aluminum
    warning:   "#ffd23f"   # Atomic Age yellow
    danger:    "#ff6f3c"   # Atomic Age rocket orange, palette has no dedicated red
    code-color: "#cbcbcb"  # Atomic Age brushed aluminum, inline & block code text
    code-bg:    "#011627"  # Atomic Age dark navy, inline & block code background
    base_font:
      google: Ubuntu
    heading_font:
      google: Fira Sans Condensed
    code_font:
      google: Ubuntu Mono
