url: https://mjfrigaard.github.io/stackcallr/

navbar:
  bg: primary       # paint the bar with $primary (Atomic Blue)
  type: dark        # light text for contrast on the deep blue bar

template:
  bootstrap: 5
  theme: arrow-light
  bslib:
    primary:   "#ca3c4a"   # Classic Retro red, links, buttons, navbar
    secondary: "#3b383f"   # Retro Futurism charcoal, neutral text emphasis
    success:   "#99beb7"   # Classic Retro teal
    info:      "#6c6b71"   # Retro Futurism grey
    warning:   "#f2c665"   # Classic Retro yellow
    danger:    "#f4640d"   # Retro Futurism orange
    code-color: "#3b383f"  # Retro Futurism charcoal, inline & block code text
    code-bg:    "#f6f0c6"  # Retro Futurism cream, inline & block code background
    base_font:
      google: Ubuntu
    heading_font:
      google: Fira Sans Condensed
    code_font:
      google: Ubuntu Mono
